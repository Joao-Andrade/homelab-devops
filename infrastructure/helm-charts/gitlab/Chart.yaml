apiVersion: v2
name: gitlab
description: >-
  Thin wrapper chart around the official GitLab Helm chart (charts.gitlab.io).
  Pins the last chart line that still bundles PostgreSQL, Redis and MinIO as
  optional subcharts, and disables every non-essential component by default
  for a lightweight homelab install, while keeping all the toggles visible
  and commented in values.yaml.
type: application
version: 0.1.0
appVersion: "18.11"
dependencies:
  - name: gitlab
    # Aliased so this chart's own values.yaml doesn't collide with the official
    # chart's own internal "gitlab" subchart (which groups webservice, sidekiq,
    # gitaly, etc.). Everything under the top-level `upstream:` key in
    # values.yaml is passed straight through to the official chart.
    alias: upstream
    version: "9.11.12" # GitLab 18.11 - last chart line with bundled postgresql/redis/minio
    repository: "https://charts.gitlab.io/"

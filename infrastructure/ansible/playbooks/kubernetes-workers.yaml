---
- name: Configure worker node
  hosts: k3s_workers
  become: true

  roles:
    - debian_common

- name: Install k3s agent on worker nodes
  hosts: k3s_workers
  become: true
  tasks:
    - name: Read K3s token from control plane
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ groups['k3s_control_plane'][0] }}"
      register: k3s_token_raw
      no_log: true

    - name: Install K3s agent
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
      environment:
        K3S_URL: "https://{{ hostvars[groups['k3s_control_plane'][0]].ansible_host }}:6443"
        K3S_TOKEN: "{{ k3s_token_raw.content | b64decode | trim }}"

    - name: Check k3s-agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: started
        enabled: true

    - name: Check TCP connectivity to the control plane API
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k3s_control_plane'][0]].ansible_host }}"
        port: 6443
        timeout: 30

    - name: Wait for kubelet to register with the control plane
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/agent/kubelet.kubeconfig
        timeout: 120

    - name: Check flannel overlay interface exists
      ansible.builtin.command:
        cmd: ip link show flannel.1
      changed_when: false
      failed_when: false
      register: flannel_iface

    - name: Warn if flannel interface is missing
      ansible.builtin.debug:
        msg: >-
          flannel.1 interface not found yet on {{ inventory_hostname }} -
          pod-to-pod networking may not be ready. It can take a few seconds
          to appear after the agent registers, so re-check manually if this
          shows up.
      when: flannel_iface.rc != 0

- name: Verify workers joined the cluster
  hosts: localhost
  connection: local
  vars:
    kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/homelab_cluster01"
  tasks:
    - name: Check that the kubeconfig exists locally
      ansible.builtin.stat:
        path: "{{ kubeconfig_path }}"
      register: kubeconfig_stat

    - name: If there is no kubeconfig locally, show a message
      ansible.builtin.fail:
        msg: >-
          {{ kubeconfig_path }} not found. This means kubernetes-control-plane.yaml
          hasn't been run yet (it's what installs k3s on the control plane and
          pulls the kubeconfig down locally). Run it before this playbook.
      when: not kubeconfig_stat.stat.exists

    - name: Wait for each worker to report Ready
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ kubeconfig_path }}
          wait --for=condition=Ready node/{{ item }} --timeout=60s
      loop: "{{ groups['k3s_workers'] }}"
      changed_when: false

    - name: Label worker nodes with the worker role
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig={{ kubeconfig_path }}
          label node {{ item }} node-role.kubernetes.io/worker= --overwrite
      loop: "{{ groups['k3s_workers'] }}"
      changed_when: false

    - name: Get cluster node status
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig={{ kubeconfig_path }} get nodes -o wide"
      register: cluster_nodes
      changed_when: false

    - name: Show cluster node status
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
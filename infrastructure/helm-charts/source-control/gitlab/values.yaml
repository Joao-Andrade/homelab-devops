# Values for the gitlab chart.

gitlab:
  # ---------------------------------------------------------------------------
  # Required basics
  # ---------------------------------------------------------------------------
  global:
    hosts:
      domain: gitlab.internal # Base domain
      https: false # No TLS/cert-manager for now 
      gitlab:
        name: gitlab.internal # Explicit web UI hostname

    ingress:
      enabled: true
      class: "traefik"
      configureCertmanager: false

    # GitLab Agent Server for Kubernetes
    kas:
      enabled: false

    # GitLab Pages (static site hosting)
    pages:
      enabled: false

    appConfig:
      # Reply-by-email
      incomingEmail:
        enabled: false

    # Mandatory object storage - using MinIO instead of external storage
    minio:
      enabled: true
  
  gitlab:
    webservice:
      minReplicas: 1
      maxReplicas: 1
      workerProcesses: 1 # 2 if webservice becomes a bottleneck.
      metrics:
        enabled: false # Prometheus metrics endpoint
      resources:
        requests:
          memory: 1.25G
        limits:
          memory: 2.5G
      extraEnv:
        MALLOC_CONF: "dirty_decay_ms:1000,muzzy_decay_ms:1000"

    sidekiq:
      minReplicas: 1
      maxReplicas: 1
      concurrency: 10
      metrics:
        enabled: false

    gitaly:
      extraEnv:
        MALLOC_CONF: "dirty_decay_ms:1000,muzzy_decay_ms:1000"
        GITALY_COMMAND_SPAWN_MAX_PARALLEL: "2"

    gitlab-shell:
      minReplicas: 1
      maxReplicas: 1

    # For backups
    toolbox:
      enabled: true

    # Email handling
    mailroom:
      enabled: false

    # Useful for prometheus monitoring
    gitlab-exporter:
      enabled: false

    # Anti-spam service
    spamcheck:
      enabled: false


  # ---------------------------------------------------------------------------
  # Optional add-ons
  # ---------------------------------------------------------------------------

   # No TLS certs to issue while ingress is disabled.
  installCertmanager: false

  # No bundled Ingress controller
  # Using the reverse-proxy LXC instead
  nginx-ingress:
    enabled: false

  # CI runner bundled with the GitLab chart
  gitlab-runner:
    install: true

    # The runner pod can't resolve gitlab.internal (it only exists on the reverse
    # proxy and in the /etc/hosts of my computer), which is the address the chart
    # uses by default, so registering fails with "no such host". Use the internal
    # service instead (the same one ArgoCD uses to clone the repositories).
    gitlabUrl: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/

    # Max number of jobs running at the same time.
    # Each job is a pod, so for a homelab doesn't need much.
    concurrent: 2

    rbac:
      create: true

    runners:
      config: |
        [[runners]]
          # Jobs clone the repository through the internal service.
          clone_url = "http://gitlab-webservice-default.gitlab.svc.cluster.local:8181"
          [runners.kubernetes]
            namespace = "{{.Release.Namespace}}"
            image = "alpine:3.20"
            privileged = false
            [[runners.kubernetes.host_aliases]]
              ip = "192.168.1.100"
              hostnames = ["gitlab.internal", "harbor.internal", "openbao.internal", "registry.gitlab.internal"]

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # Monitoring stack
  prometheus:
    install: false

  # Container registry
  registry:
    enabled: true

  # ---------------------------------------------------------------------------
  # Mandatory data services.
  # GitLab cannot run without a database, a cache and object storage - these
  # can't simply be "disabled", only if there are external services
  # providing them.
  # ---------------------------------------------------------------------------

  # If installed separately on the cluster
  # set to false and configure `gitlab.global.psql.host`
  postgresql:
    install: true

  # If installed separately on the cluster
  # set to false and configure `gitlab.global.redis.host`
  redis:
    install: true
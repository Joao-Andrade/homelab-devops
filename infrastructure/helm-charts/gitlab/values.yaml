# Values for the `gitlab` wrapper chart.
#
# This chart declares the official GitLab Helm chart (charts.gitlab.io) as a
# dependency, aliased "upstream" in Chart.yaml. In Helm, values for a
# dependency must be nested under a key matching its name/alias - so
# everything below `upstream:` is passed straight through to the official
# chart. If you're following the official GitLab Helm chart docs, prefix
# whatever path they show you with `upstream.` to find it here
# (e.g. their `global.hosts.domain` is this file's `upstream.global.hosts.domain`).
#
# Pinned chart version: 9.11.12 (GitLab 18.11). This is the last chart line
# before GitLab 19.0 removed the bundled PostgreSQL, Redis and MinIO
# subcharts in favour of mandatory external services - keeping this version
# lets a homelab install stay fully self-contained with one `helm install`.
#
# Design goal: disable every *optional* component so the first install is as
# small as possible, while keeping every toggle visible here instead of
# leaving it buried inside the official chart's own defaults.

upstream:
  # ---------------------------------------------------------------------------
  # Required basics
  # ---------------------------------------------------------------------------
  global:
    hosts:
      domain: gitlab.internal # CHANGE ME if you use a different base domain. The
      # chart prefixes this with "gitlab." by default, so the web UI ends up
      # at gitlab.gitlab.internal - see the note on `hosts.gitlab.name` below
      # if you'd rather it not double up the "gitlab" part.
      https: false # No TLS/cert-manager for now - keeps the first install simple.
      gitlab:
        name: gitlab.internal # Explicit web UI hostname, overriding the
        # "gitlab.<domain>" default above so it matches the domain exactly -
        # this is what the reverse-proxy LXC's nginx config must route to.

    ingress:
      enabled: true # Create Ingress objects for webservice/registry/etc.
      class: "traefik" # Override the chart's "gitlab-nginx" default (nginx-ingress
      # is disabled below) with k3s's bundled IngressClass. Empty string doesn't
      # work here - this chart sets `spec.ingressClassName` unconditionally to
      # whatever this value is, and Kubernetes rejects "" as an invalid name;
      # it must be omitted entirely to "fall back to default", which this
      # chart's template doesn't support. "traefik" is k3s's built-in class name.
      configureCertmanager: false # Nothing to configure, cert-manager isn't installed.

    kas:
      enabled: false # GitLab Agent Server for Kubernetes - not needed yet.

    pages:
      enabled: false # GitLab Pages (static site hosting) - not needed yet.

    appConfig:
      incomingEmail:
        enabled: false # Reply-by-email - not needed yet.

    minio:
      enabled: true # Mandatory object storage (see note below) - set to false +
      # configure `upstream.global.appConfig.object_store` to use external
      # S3-compatible storage instead.

  # ---------------------------------------------------------------------------
  # Optional add-ons - this is the "disable as much as possible" list.
  # Every one of these can be flipped back to true/enabled independently.
  # ---------------------------------------------------------------------------
  # NOTE: cert-manager's toggle is a top-level key on the official chart itself
  # (not nested under a `certmanager:` block - that's a different, unrelated
  # subchart's own values and its schema rejects an `install` property).
  installCertmanager: false # No TLS certs to issue while ingress is disabled.

  nginx-ingress:
    enabled: false # No bundled Ingress controller - the reverse-proxy LXC stays
    # untouched for now, same decision already made for simple-app.

  gitlab-runner:
    install: false # No in-cluster CI runner yet. Install separately later if wanted.

  prometheus:
    install: false # Monitoring stack - skip for the first install.

  registry:
    enabled: true # Container registry - lightweight and useful, kept on.
    # Set to false to disable it entirely.

  # ---------------------------------------------------------------------------
  # Mandatory data services.
  # GitLab cannot run without a database, a cache and object storage - these
  # can't simply be "disabled", only swapped between bundled (in-cluster) and
  # external. Bundled = true here means "use the one this chart installs for
  # you", which is what keeps this a zero-extra-infra homelab install.
  # ---------------------------------------------------------------------------
  postgresql:
    install: true # Set to false + configure `upstream.global.psql.host` to use
    # an external PostgreSQL server instead.

  redis:
    install: true # Set to false + configure `upstream.global.redis.host` to use
    # an external Redis/Valkey server instead.
  # (MinIO's toggle lives under `upstream.global.minio.enabled` above, not here -
  # it's the one exception where the bundled/external switch is a global key
  # instead of a top-level subchart key.)

  # ---------------------------------------------------------------------------
  # The official chart's own internal service group (webservice, sidekiq,
  # gitaly, gitlab-shell, toolbox, ...). Kept minimal: single replica for
  # everything, and the non-essential background services turned off.
  # ---------------------------------------------------------------------------
  gitlab:
    webservice:
      minReplicas: 1
      maxReplicas: 1

    sidekiq:
      minReplicas: 1
      maxReplicas: 1

    gitlab-shell:
      minReplicas: 1
      maxReplicas: 1

    toolbox:
      enabled: true # Needed for backups and `kubectl exec` rails console access.

    mailroom:
      enabled: false # Incoming email handling - not needed yet.

    gitlab-exporter:
      enabled: false # Extra Prometheus metrics - skip since prometheus.install is false.

    spamcheck:
      enabled: false # Anti-spam service - not needed for a small private instance.

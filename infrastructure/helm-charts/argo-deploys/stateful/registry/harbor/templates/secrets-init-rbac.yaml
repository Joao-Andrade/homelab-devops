# Lets the secrets-init container (an init container of the Valkey pod, see
# values.yaml) create the Secrets the Harbor chart reads, only in this namespace.
# "create" can't be restricted by secret name (the object does not exist yet).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-secrets-init
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-secrets-init
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-secrets-init
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-secrets-init
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-secrets-init
  apiGroup: rbac.authorization.k8s.io

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ include "simple-app.name" . }}
  labels:
    {{- include "simple-app.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "simple-app.labels" . | nindent 4 }}

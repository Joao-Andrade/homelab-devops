apiVersion: v2
name: openbao
description: >-
  I used the official OpenBao helm chart as a base, and customized the values
  file. OpenBao is a Linux Foundation fork of HashiCorp Vault, kept API/config
  compatible. Standalone mode (single pod, file storage), Agent
  Injector disabled by default.
type: application
version: 0.1.0
appVersion: "v2.6.2" # Actual OpenBao version
dependencies:
  - name: openbao
    version: "0.29.4" # Official helm version
    repository: "https://openbao.github.io/openbao-helm"

apiVersion: v2
name: gitea-runner
description: >-
  Based on the official Gitea Actions Helm chart (act_runner).
  Deploys a runner with a Docker-in-Docker sidecar.
  Registered on the Gitea deployed in this cluster using a token from an existing Secret.
type: application
version: 0.1.0
appVersion: "3.0.2" # Version used by the official chart
dependencies:
  - name: actions
    version: "0.1.3" # Official Helm version
    repository: "https://dl.gitea.com/charts/"

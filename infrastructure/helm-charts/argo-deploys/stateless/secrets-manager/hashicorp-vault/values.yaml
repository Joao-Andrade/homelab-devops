# Values for the hashicorp-vault chart.

vault:
  # No TLS/cert-manager for now - same as the other charts, the reverse-proxy
  # LXC only terminates HTTP.
  global:
    tlsDisable: true

  # Agent Injector (auto-injects Vault secrets into other pods' containers) -
  # not needed yet, nothing consumes Vault secrets. Enable later once an app
  # actually needs it.
  injector:
    enabled: false

  server:
    # Standalone mode (single pod, file storage) instead of Raft HA -
    # there's only one node in this cluster, HA buys nothing here.
    ha:
      enabled: false

    standalone:
      enabled: true
      config: |
        listener "tcp" {
          address     = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable = true
        }
        storage "file" {
          path = "/vault/data"
        }

    dataStorage:
      enabled: true
      size: 2Gi

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    ingress:
      enabled: true
      ingressClassName: "traefik"
      hosts:
        - host: vault.internal
          paths: []

  ui:
    enabled: true

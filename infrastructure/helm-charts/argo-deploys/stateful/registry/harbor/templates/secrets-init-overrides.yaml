{{- /*
Optional: only rendered if at least one value is set under secretsInit in
values.yaml. Read by the secrets-init container (envFrom, optional).
*/ -}}
{{- $v := .Values.secretsInit | default dict }}
{{- if or $v.adminPassword $v.secretKey $v.coreSecret $v.xsrfKey $v.jobserviceSecret $v.registrySecret $v.registryPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets-init-overrides
type: Opaque
stringData:
  {{- with $v.adminPassword }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $v.secretKey }}
  SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- with $v.coreSecret }}
  CORE_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $v.xsrfKey }}
  XSRF_KEY: {{ . | quote }}
  {{- end }}
  {{- with $v.jobserviceSecret }}
  JOBSERVICE_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $v.registrySecret }}
  REGISTRY_SECRET: {{ . | quote }}
  {{- end }}
  {{- with $v.registryPassword }}
  REGISTRY_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
